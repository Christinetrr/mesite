name: Deploy Website

# Run whenever we push to main
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. Download code
      - uses: actions/checkout@v4

      # 2. Set up Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm

      # 3. Install dependencies
      - run: npm ci

      # 4. Build React app
      - run: npm run build

      # 5. Configure GitHub Pages
      - uses: actions/configure-pages@v5

      # 6. Upload dist folder
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # 7. Deploy website
      - id: deployment
        uses: actions/deploy-pages@v4
